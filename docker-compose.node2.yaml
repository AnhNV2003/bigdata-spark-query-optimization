name: bigdata-spark-node2

services:
  minio2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio2
    network_mode: host
    extra_hosts:
      - "minio1:100.127.42.127"
      - "minio2:100.113.89.12"
    command:
      - server
      - --address
      - ":9100"
      - --console-address
      - ":9101"
      - http://minio{1...2}:9100/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./service/minio2/data:/data
    restart: unless-stopped

  spark-worker-node2:
    image: spark:4.0.1-python3
    container_name: spark-worker-node2
    network_mode: host
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh \
          --host 100.113.89.12 \
          --port 7084 \
          --webui-port 8084 \
          -c 6 \
          -m 6G \
          spark://100.127.42.127:7077
        tail -f /dev/null
    environment:
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-worker-node2/local:/spark-local
      - ./service/spark-worker-node2/logs:/spark-logs
    restart: unless-stopped
