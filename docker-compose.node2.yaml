name: bigdata-spark-node2

services:
  minio2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio2
    network_mode: host
    extra_hosts:
      - "minio1:${NODE1_IP:-127.0.0.1}"
      - "minio2:${NODE2_IP:-127.0.0.1}"
    command:
      - server
      - --address
      - ":${MINIO_DISTRIBUTED_API_PORT:-9100}"
      - --console-address
      - ":${MINIO_DISTRIBUTED_CONSOLE_PORT:-9101}"
      - http://minio{1...2}:${MINIO_DISTRIBUTED_API_PORT:-9100}/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - ./service/minio2/data:/data
    restart: unless-stopped

  spark-worker-node2:
    image: spark:4.0.1-python3
    container_name: spark-worker-node2
    network_mode: host
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh \
          --host ${NODE2_IP:-127.0.0.1} \
          --port ${SPARK_NODE2_WORKER_PORT:-7084} \
          --webui-port ${SPARK_NODE2_WORKER_WEBUI_PORT:-8084} \
          -c ${SPARK_NODE2_WORKER_CORES:-6} \
          -m ${SPARK_NODE2_WORKER_MEMORY:-6G} \
          ${SPARK_MASTER:-spark://127.0.0.1:7077}
        tail -f /dev/null
    environment:
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-worker-node2/local:/spark-local
      - ./service/spark-worker-node2/logs:/spark-logs
    restart: unless-stopped
