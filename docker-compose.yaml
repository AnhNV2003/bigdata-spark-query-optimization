name: bigdata-spark-node1

services:
  spark-master:
    image: spark:4.0.1-python3
    container_name: spark-master
    network_mode: host
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-master.sh \
          --host ${NODE1_IP:-127.0.0.1} \
          --port ${SPARK_MASTER_PORT:-7077} \
          --webui-port ${SPARK_MASTER_WEBUI_PORT:-8080}
        tail -f /dev/null
    environment:
      SPARK_MASTER_HOST: "${NODE1_IP:-127.0.0.1}"
      SPARK_MASTER_PORT: "${SPARK_MASTER_PORT:-7077}"
      SPARK_MASTER_WEBUI_PORT: "${SPARK_MASTER_WEBUI_PORT:-8080}"
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-master/local:/spark-local
      - ./service/spark-master/logs:/spark-logs
    restart: unless-stopped

  spark-worker-1:
    image: spark:4.0.1-python3
    container_name: spark-worker-1
    network_mode: host
    depends_on:
      - spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh \
          --host ${NODE1_IP:-127.0.0.1} \
          --port ${SPARK_WORKER1_PORT:-7081} \
          --webui-port ${SPARK_WORKER1_WEBUI_PORT:-8081} \
          -c ${SPARK_WORKER_CORES:-12} \
          -m ${SPARK_WORKER_MEMORY:-24G} \
          ${SPARK_MASTER:-spark://127.0.0.1:7077}
        tail -f /dev/null
    environment:
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-worker-1/local:/spark-local
      - ./service/spark-worker-1/logs:/spark-logs
    restart: unless-stopped

  spark-worker-2:
    image: spark:4.0.1-python3
    container_name: spark-worker-2
    network_mode: host
    depends_on:
      - spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh \
          --host ${NODE1_IP:-127.0.0.1} \
          --port ${SPARK_WORKER2_PORT:-7082} \
          --webui-port ${SPARK_WORKER2_WEBUI_PORT:-8082} \
          -c ${SPARK_WORKER_CORES:-12} \
          -m ${SPARK_WORKER_MEMORY:-24G} \
          ${SPARK_MASTER:-spark://127.0.0.1:7077}
        tail -f /dev/null
    environment:
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-worker-2/local:/spark-local
      - ./service/spark-worker-2/logs:/spark-logs
    restart: unless-stopped

  spark-worker-3:
    image: spark:4.0.1-python3
    container_name: spark-worker-3
    network_mode: host
    depends_on:
      - spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh \
          --host ${NODE1_IP:-127.0.0.1} \
          --port ${SPARK_WORKER3_PORT:-7083} \
          --webui-port ${SPARK_WORKER3_WEBUI_PORT:-8083} \
          -c ${SPARK_WORKER_CORES:-12} \
          -m ${SPARK_WORKER_MEMORY:-24G} \
          ${SPARK_MASTER:-spark://127.0.0.1:7077}
        tail -f /dev/null
    environment:
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-worker-3/local:/spark-local
      - ./service/spark-worker-3/logs:/spark-logs
    restart: unless-stopped

  spark-worker-4:
    image: spark:4.0.1-python3
    container_name: spark-worker-4
    network_mode: host
    depends_on:
      - spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh \
          --host ${NODE1_IP:-127.0.0.1} \
          --port ${SPARK_WORKER4_PORT:-7084} \
          --webui-port ${SPARK_WORKER4_WEBUI_PORT:-8084} \
          -c ${SPARK_WORKER_CORES:-12} \
          -m ${SPARK_WORKER_MEMORY:-24G} \
          ${SPARK_MASTER:-spark://127.0.0.1:7077}
        tail -f /dev/null
    environment:
      SPARK_LOCAL_DIRS: /spark-local
      SPARK_LOG_DIR: /spark-logs
    volumes:
      - ./service/spark-worker-4/local:/spark-local
      - ./service/spark-worker-4/logs:/spark-logs
    restart: unless-stopped

  minio1:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio1
    network_mode: host
    extra_hosts:
      - "minio1:${NODE1_IP:-127.0.0.1}"
      - "minio2:${NODE2_IP:-127.0.0.1}"
    command:
      - server
      - --address
      - ":${MINIO_DISTRIBUTED_API_PORT:-9100}"
      - --console-address
      - ":${MINIO_DISTRIBUTED_CONSOLE_PORT:-9101}"
      - http://minio{1...2}:${MINIO_DISTRIBUTED_API_PORT:-9100}/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - ./service/minio1/data:/data
    restart: unless-stopped
