name: bigdata-spark

services:
  spark-master:
    image: spark:4.0.1-python3
    container_name: spark-master
    hostname: spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-master.sh
        tail -f /dev/null
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      SPARK_LOCAL_DIRS: /tmp/spark-local
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - .:/workspace
      - ./dataset/reference:/workspace/reference:ro
    working_dir: /workspace

  spark-worker:
    image: spark:4.0.1-python3
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077
        tail -f /dev/null
    environment:
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_LOCAL_DIRS: /tmp/spark-local
    ports:
      - "8081:8081"
    volumes:
      - .:/workspace
      - ./dataset/reference:/workspace/reference:ro
    working_dir: /workspace

  spark-worker-2:
    image: spark:4.0.1-python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command:
      - /bin/bash
      - -lc
      - |
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077
        tail -f /dev/null
    environment:
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_LOCAL_DIRS: /tmp/spark-local
    ports:
      - "8082:8081"
    volumes:
      - .:/workspace
      - ./dataset/reference:/workspace/reference:ro
    working_dir: /workspace

  minio1:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio1
    hostname: minio1
    command:
      - server
      - --console-address
      - ":9001"
      - http://minio1/data1
      - http://minio1/data2
      - http://minio2/data1
      - http://minio2/data2
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./service/minio1/data1:/data1
      - ./service/minio1/data2:/data2

  minio2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio2
    hostname: minio2
    command:
      - server
      - --console-address
      - ":9001"
      - http://minio1/data1
      - http://minio1/data2
      - http://minio2/data1
      - http://minio2/data2
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./service/minio2/data1:/data1
      - ./service/minio2/data2:/data2

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    container_name: jupyter
    hostname: jupyter
    depends_on:
      - spark-master
      - minio1
    ports:
      - "8888:8888"
      - "4040:4040"
      - "4041:4041"
    volumes:
      - .:/home/jovyan/work
      - ./dataset/reference:/home/jovyan/work/reference:ro
